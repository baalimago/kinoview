services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/usr/local/bin/kinoview-entrypoint"]
    ports:
      - "0.0.0.0:8333:8333" # S3 gateway — kinoview (loopback) and LAN checkout
    volumes:
      - ./docker/entrypoint.sh:/usr/local/bin/kinoview-entrypoint:ro
      - seaweedfs-data:/data

volumes:
  seaweedfs-data:
